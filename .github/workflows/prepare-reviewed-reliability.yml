name: Prepare exact reviewed reliability source
on:
  push:
    branches: [fix/hub-reliability-20261111]
    paths: [.github/workflows/prepare-reviewed-reliability.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'Dmoore3393/tcs-operations-hub' && github.ref == 'refs/heads/fix/hub-reliability-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hub-reliability-20261111
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply checksum-verified reviewed patch to this branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '80e11bd1c4cb039e9930e0ae83d6b00ab187832b'
          curl --fail --silent --show-error --max-time 30 'https://sb-2dy7cr0idqkv.vercel.run/reliability-exact.patch' -o /tmp/reliability-exact.patch
          echo '333095fa56483c92d6be31a809b9cb7288aad9c9fa24871e3cf9f6a1420e280b  /tmp/reliability-exact.patch' | sha256sum --check --strict
          git apply --check /tmp/reliability-exact.patch
          git apply --index /tmp/reliability-exact.patch
          python3 - <<'PY'
          import subprocess
          expected={'scripts/test-driver-route-view.mjs','scripts/test-hub-reliability.mjs','scripts/test-shift-report-authors.mjs','scripts/verify-app-readiness.mjs','src/app/(portal)/shift-reports/page.tsx','src/app/(portal)/team-access/page.tsx','src/components/files/LocationFilesPanel.tsx','src/components/hub/HubUI.tsx'}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual==expected,(actual,expected)
          PY
      - name: Validate exact source without live accounts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit
          npm run security:check
          npm run app:check
          node --test --test-concurrency=2 scripts/test-hub-reliability.mjs scripts/test-location-person-files.mjs scripts/test-child-file-audits.mjs scripts/test-child-family.mjs scripts/test-family-edit.mjs scripts/test-child-sort.mjs scripts/test-route-access.mjs scripts/test-hub-tool-groups.mjs scripts/test-driver-route-view.mjs scripts/test-connected-transport-ui.mjs scripts/test-shift-report-authors.mjs scripts/test-shift-report-type.mjs scripts/test-team-schedules.mjs scripts/test-staff-setup-links.mjs scripts/test-employee-invites.mjs scripts/test-request-timeout.mjs scripts/test-pwa-update-prompt.mjs
      - name: Commit verified source on the review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply exact verified reliability source; 115 focused checks passed'
          git push origin HEAD:refs/heads/fix/hub-reliability-20261111
