name: Privacy & Production Security Gate

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  privacy-security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify no bundled child/family data and production protections
        run: npm run security:check
      - name: Verify native app readiness foundation
        run: npm run app:check
      - name: Verify staff setup, contact editing, and birthday privacy
        run: node --test scripts/test-auth-email.mjs scripts/test-staff-language.mjs scripts/test-staff-contact.mjs scripts/test-staff-location-coverage.mjs scripts/test-employee-invites.mjs scripts/test-invitation-session.mjs scripts/test-staff-setup-links.mjs scripts/test-notification-access.mjs scripts/test-pwa-update-prompt.mjs scripts/test-child-edit-preservation.mjs scripts/test-import-recovery.mjs
      - name: Verify timesheet workflow, accountability, and database locks
        run: node --test scripts/test-timesheet-workflow.mjs scripts/test-timesheet-checklist.mjs scripts/test-timesheet-policy.mjs scripts/test-timesheet-policy-database.mjs scripts/test-timesheet-api.mjs scripts/test-timesheet-controls.mjs scripts/test-timesheet-database.mjs scripts/test-timesheet-direct-intake.mjs
      - name: Verify per-home KidKare submissions and private claim evidence
        run: node --test scripts/test-kidkare-submissions.mjs
      - name: Verify account deletion, bounded loading, native API access, and family alert authorization
        run: node --test scripts/test-account-deletion.mjs scripts/test-request-timeout.mjs scripts/test-native-api.mjs scripts/test-native-family-notifications.mjs scripts/test-route-access.mjs scripts/test-hub-tool-groups.mjs scripts/test-staff-scheduler.mjs scripts/test-maintenance-access.mjs scripts/test-transportation-day.mjs scripts/test-school-pickup-stops.mjs scripts/test-transport-child-schools.mjs scripts/test-transport-driver-assignments.mjs scripts/test-connected-transport-ui.mjs scripts/test-form-choices.mjs scripts/test-school-attendance.mjs
      - name: Typecheck application
        run: npx tsc --noEmit
      - name: Verify driver pushes with the Hub closed
        run: node --test scripts/test-transport-background-push.mjs
      - name: Verify communications isolation and daily follow-through
        run: node --test scripts/test-communications-database.mjs scripts/test-communications-api.mjs scripts/test-daily-follow-through.mjs
      - name: Verify reviewed and atomic Brightwheel imports
        run: node --test scripts/test-brightwheel-import.mjs scripts/test-brightwheel-database.mjs
      - name: Verify new-hire onboarding scope, verification and audit safety
        run: node --test scripts/test-staff-onboarding.mjs scripts/test-staff-onboarding-database.mjs
      - name: Build application
        run: npm run build
      - name: Verify location labels and stable location identities
        run: node --test scripts/test-location-labels.mjs
