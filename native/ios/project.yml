name: TheHub

options:
  deploymentTarget:
    iOS: "16.4"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: "16.4"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  TheHub:
    type: application
    platform: iOS
    sources:
      - path: TheHub
    resources:
      - path: TheHub/Resources
    preBuildScripts:
      - name: Prepare official Hub app icon
        path: scripts/prepare-assets.sh
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomasonchildcaresolutions.thehub
        PRODUCT_NAME: The Hub
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: TheHub/TheHub.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    info:
      path: TheHub/Info.plist
      properties:
        CFBundleDisplayName: The Hub
        CFBundleName: The Hub
        LSApplicationCategoryType: public.app-category.business
        NSFaceIDUsageDescription: The Hub uses Face ID to help protect access to TCS staff information on this device.
        NSCameraUsageDescription: The Hub uses the camera for TCS location QR check-in, staff clocking, and approved childcare document scanning.
        NSPhotoLibraryUsageDescription: The Hub can access selected photos when authorized staff upload approved childcare documents.
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: HubLaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
