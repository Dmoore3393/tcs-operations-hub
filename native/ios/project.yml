name: TheHub

options:
  deploymentTarget:
    iOS: "16.4"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.10
    IPHONEOS_DEPLOYMENT_TARGET: "16.4"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  TheHub:
    type: application
    platform: iOS
    sources:
      - path: TheHub
    resources:
      - path: TheHub/Resources
    preBuildScripts:
      - name: Prepare official Hub app icon
        path: scripts/prepare-assets.sh
        inputFiles:
          - $(SRCROOT)/../../public/app-icon-512.png
        outputFiles:
          - $(SRCROOT)/TheHub/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thomasonchildcaresolutions.thehub
        PRODUCT_NAME: The Hub
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6Y2923TFK5
        CODE_SIGN_ENTITLEMENTS: TheHub/TheHub.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    info:
      path: TheHub/Info.plist
      properties:
        CFBundleDisplayName: The Hub
        CFBundleName: The Hub
        LSApplicationCategoryType: public.app-category.business
        NSFaceIDUsageDescription: The Hub uses Face ID to help protect access to authorized TCS staff and family information on this device.
        NSCameraUsageDescription: The Hub uses the camera when an authorized user chooses to capture an approved childcare photo, document, QR code, or other supported image.
        NSPhotoLibraryUsageDescription: The Hub can access only the photos an authorized staff member or family user selects to upload for approved childcare features such as child profile photos, daily photos, menus, newsletters, or documents.
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: HubLaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight


schemes:
  TheHub:
    build:
      targets:
        TheHub: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
